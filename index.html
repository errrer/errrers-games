<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="768"></canvas>

    <div id="menu" class="overlay">
      <!-- MAIN SCREEN -->
      <div id="screen-main" class="panel">
        <h1>BOT ARENA</h1>
        <p class="tag">Top-down team shooter &middot; first to 3 rounds wins</p>

        <div id="result" class="result hidden"></div>

        <div class="row">
          <button class="big" data-size="5">
            <span class="big-title">5 v 5</span>
            <span class="big-sub">You + 4 bots vs 5 bots</span>
          </button>
          <button class="big" data-size="1">
            <span class="big-title">1 v 1</span>
            <span class="big-sub">Duel a single bot</span>
          </button>
        </div>

        <div class="diff">
          <span>Bot difficulty</span>
          <button class="chip" data-diff="easy">Easy</button>
          <button class="chip active" data-diff="normal">Normal</button>
          <button class="chip" data-diff="hard">Hard</button>
        </div>

        <div class="help">
          <b>WASD</b> / arrows move &nbsp;&middot;&nbsp; <b>Mouse</b> aim &nbsp;&middot;&nbsp;
          <b>Hold left click</b> shoot &nbsp;&middot;&nbsp; <b>Esc</b> pause
        </div>
      </div>

      <!-- MAP SELECT SCREEN -->
      <div id="screen-maps" class="panel hidden">
        <h2 id="maps-title">Choose a map</h2>
        <div id="map-list" class="row"></div>
        <button id="back" class="chip back">&larr; Back</button>
      </div>
    </div>
  </div>

  <script src="maps.js"></script>
  <script src="game.js"></script>
</body>
</html>
